services:
  postgres:
    image: postgres:18-alpine
    container_name: confirmam_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: confirmam
    ports:
      - "5432:5432"
    volumes:
      - confirmam_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d confirmam"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  confirmam_pgdata:
    driver: local